<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디버깅</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:#e6edf3;font-family:'Noto Sans KR',sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;
    background:
      radial-gradient(600px 260px at 50% 30%, rgba(37,244,238,.07), transparent 70%),
      radial-gradient(500px 240px at 56% 34%, rgba(254,44,85,.06), transparent 70%),
      radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px) 0 0/22px 22px,
      #0d1117}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px)}

  /* 제목: 청록·분홍이 어긋나 겹치는 효과 */
  .glitch{margin:0 0 40px;font-weight:900;font-size:clamp(56px,9vw,104px);letter-spacing:-1px;line-height:1;color:#fff;
    text-shadow:-4px -3px 0 #25f4ee, 4px 3px 0 #fe2c55}

  .tagline{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:4px;color:#6e7681;margin-bottom:38px}
  .tagline b{color:#25f4ee;font-weight:700}
  .tagline i{font-style:normal;color:#fe2c55}
  footer{margin-top:34px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#484f58;letter-spacing:2px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:min(820px,96vw)}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  a.card{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
    background:rgba(22,27,34,.85);border:1px solid #30363d;border-radius:14px;padding:22px 24px;
    transition:transform .18s cubic-bezier(.3,1.6,.5,1),border-color .18s,background .18s,box-shadow .18s}
  a.card:hover{transform:translateY(-5px) scale(1.03);background:#1b222c;border-color:transparent;
    box-shadow:-4px -3px 0 #25f4ee, 4px 3px 0 #fe2c55, 0 14px 30px rgba(0,0,0,.45)}
  a.card:active{transform:translateY(-1px) scale(.97);box-shadow:-1px -1px 0 #25f4ee, 1px 1px 0 #fe2c55, 0 4px 10px rgba(0,0,0,.4);transition-duration:.06s}
  a.card.go{animation:zap .32s steps(1) forwards}
  @keyframes zap{
    0%{transform:scale(.97);box-shadow:-6px 0 0 #25f4ee, 6px 0 0 #fe2c55}
    20%{transform:translate(4px,-2px) skewX(-8deg) scale(1.02);box-shadow:8px -2px 0 #25f4ee, -8px 2px 0 #fe2c55}
    40%{transform:translate(-5px,2px) skewX(6deg) scale(1.04);box-shadow:-10px 3px 0 #25f4ee, 10px -3px 0 #fe2c55;filter:brightness(1.5)}
    60%{transform:translate(2px,0) scale(1.06);box-shadow:-3px -3px 0 #25f4ee, 3px 3px 0 #fe2c55;opacity:.7}
    80%{transform:scale(1.1);opacity:.35;filter:brightness(2)}
    100%{transform:scale(1.14);opacity:0}}
  a.card:hover .name{text-shadow:-2px -1px 0 #25f4ee, 2px 1px 0 #fe2c55}
  a.card:hover .ico{opacity:1;transform:scale(1.18) rotate(-6deg)}
  a.card:hover .ico svg{stroke:#e6edf3}
  .no{font-family:'JetBrains Mono',monospace;font-size:15px;color:#25f4ee;font-weight:700}
  a.card:nth-child(even) .no{color:#fe2c55}
  .name{font-size:22px;font-weight:700}
  .ico{margin-left:auto;width:30px;height:30px;opacity:.55;transition:opacity .18s,transform .18s}
  .ico svg{width:100%;height:100%;fill:none;stroke:#8b949e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ico svg .odd{stroke:#fe2c55}
</style>
</head>
<body>
  <h1 class="glitch" data-text="디버깅">디버깅</h1>

  <div class="grid">
    <a class="card" href="keyboard.html"><span class="no">01</span><span class="name">고장 난 키보드</span><span class="ico"><svg viewBox="0 0 32 32"><rect x="3" y="8" width="26" height="16" rx="3"/><path d="M8 13h.01M12 13h.01M16 13h.01M20 13h.01M24 13h.01M9 17h.01M13 17h.01M17 17h.01M21 17h.01M11 20.5h10"/></svg></span></a>
    <a class="card" href="color.html"><span class="no">02</span><span class="name">다른 색깔 찾기</span><span class="ico"><svg viewBox="0 0 32 32"><rect x="5" y="5" width="9" height="9" rx="2"/><rect x="18" y="5" width="9" height="9" rx="2"/><rect x="5" y="18" width="9" height="9" rx="2"/><rect x="18" y="18" width="9" height="9" rx="2" class="odd"/></svg></span></a>
    <a class="card" href="jump.html"><span class="no">03</span><span class="name">점프 맵</span><span class="ico"><svg viewBox="0 0 32 32"><path d="M7 25.5c-2.2 0-3.5-1.4-3.5-3s1.3-3 3-3c.4-2.3 2.3-3.8 4.6-3.8 2 0 3.6 1.2 4.3 2.8.5-.2 1-.3 1.6-.3 2.2 0 3.8 1.6 3.8 3.6s-1.6 3.7-3.8 3.7z"/><path d="M24 17V6M20.5 9.5 24 6l3.5 3.5"/></svg></span></a>
    <a class="card" href="detective.html"><span class="no">04</span><span class="name">수행평가 표절 사건</span><span class="ico"><svg viewBox="0 0 32 32"><path d="M8 4h11l6 6v18H8z"/><path d="M19 4v6h6"/><circle cx="15" cy="18" r="4"/><path d="m18 21 3.5 3.5"/></svg></span></a>
  </div>
<script>
  // 클릭하면 글리치처럼 번쩍인 뒤 게임으로 이동
  document.querySelectorAll('a.card').forEach(a => a.addEventListener('click', e => {
    if(e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    a.classList.add('go');
    setTimeout(() => { location.href = a.getAttribute('href'); }, 300);
  }));
  // 뒤로 가기로 돌아왔을 때 카드가 사라진 채로 남지 않게
  window.addEventListener('pageshow', () => document.querySelectorAll('a.card.go').forEach(a => a.classList.remove('go')));
</script>
</body>
</html>
